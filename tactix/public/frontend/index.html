<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/tactix/frontend/tactix_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactix</title>
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/tactix/frontend/assets/index-DdkN3qiy.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/tactix/frontend/assets/index-BuGP2iM1.css">
  </head>
  <body>
    <div id="app"></div>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
